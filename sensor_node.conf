      then:
        - lambda: |-
              if(x[0]==id(internalResponse_id)[0] and x[1]==id(internalResponse_id)[1] and x[2]==0xfa and x[3]==0x4e and x[4]==0x6a) {
                if (x[5]== 0x00 and x[6] == 0x01){
                  id(cooling_mode_state).publish_state(true);
                  ESP_LOGD("main", "Cooling mode is on");
                }
                else if(x[5]==0x00 and x[6] == 0x00){
                  id(cooling_mode_state).publish_state(false);
                  ESP_LOGD("main", "Cooling mode is off");
                  }
                }



