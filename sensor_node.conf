  framework:
    type: esp-idf

# Enable logging
logger:
#  level: VERY_VERBOSE
# Enable Home Assistant API
api:
  encryption:
    key: "redacted"


ota:
  platform: esphome
  password: "redacted"

wifi:
  ssid: "redacted"
  password: "redacted"
  min_auth_mode: WPA2

  use_address: <ip-address>


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Sensor-Node-05-Hzg"
    password: "redacted"

captive_portal:

switch:
  - platform: gpio
    id: can_levelshifter_oe
    name: "CAN Levelshifter OE"
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true
    setup_priority: 1000.0

spi:
  id: McpSpi
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

canbus:
  - platform: mcp2515
    id: my_mcp2515
    spi_id: McpSpi
    cs_pin: GPIO17
    can_id: 680
    use_extended_id: false
    bit_rate: 20kbps
    clock: 8MHZ
    data_rate: 200kHz
    mode: LOOPBACK
    on_frame:
      - can_id: 0x123
        use_extended_id: false
        remote_transmission_request: false
        then:
          - lambda: |-
              if (x.size() != 4) {
                ESP_LOGE("CAN_TEST", "Falsche Empfangslaenge: %u", unsigned(x.size()));
                return;
              }
              if (x[0] == 0x11 && x[1] == 0x22 && x[2] == 0x33 && x[3] == 0x44) {
                ESP_LOGI("CAN_TEST", "PASS: LOOPBACK empfangen: 11 22 33 44");
              } else {
                ESP_LOGE("CAN_TEST", "Falsche Daten: %02X %02X %02X %02X", x[0], x[1], x[2], x[3]);
              }

interval:
  - interval: 2s
    startup_delay: 5s
    then:
      - lambda: |-
          if (id(my_mcp2515).is_failed()) {
            ESP_LOGE("CAN_TEST", "MCP2515-Initialisierung fehlgeschlagen; kein Sendeversuch.");
            return;
          }
          auto result = id(my_mcp2515).send_data(0x123, false, std::vector<uint8_t>{0x11, 0x22, 0x33, 0x44});
          ESP_LOGI("CAN_TEST", "Sendeauftrag: Ergebnis=%d (0=uebergeben, 2=Sendepuffer belegt). Erfolg erst bei PASS-Empfang!", int(result));

```
With this code, every second loopback message was not correctly returned.
In the end I started to connect single pins not through the levelshifter but directly and found that a solution was to connect the SCK-Pin directly from the ESP-board to the CAN-module.
Maybe someone knows what is the reason for the problem here?

